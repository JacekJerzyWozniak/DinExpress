<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Din Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Keania+One&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 70vw;
            margin: 50px auto;
            /* background-image: url(pexels-steve-25478870.jpg); */
            background-color: whitesmoke;
        }

        h1 {
            background: #FFFFFF;
            background: linear-gradient(150deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 1) 7%, rgba(255, 0, 0, 1) 86%, rgba(255, 255, 255, 1) 93%, rgba(255, 255, 255, 1) 100%);
            text-align: center;
            font-family: "Keania One", sans-serif;
            font-weight: 300;
            font-style: normal;
            font-size: 50px;
            max-width: 30vw;
            margin: 0 auto;
            padding: 15px 0;
        }

        .logo {
            margin-bottom: 30px;
            position: relative;
            left: 60%;
        }

        p {
            font-family: "Keania One", sans-serif;
            font-weight: 100;
            float: left;
        }

        img {
            height: 13px;
            margin-left: 10px;
            margin-top: 5px;
        }

        .clearfix {
            content: "";
            display: block;
            clear: both;
        }

        .main {
            margin-top: 80px;
            width: 100%;
            height: 50vh;
        }

        form {
            width: 40%;
            height: 100%;
            float: left;
            font-family: "Roboto", sans-serif;
        }

        input,
        textarea,
        button {
            display: block;
            width: 65%;
            margin: 9% auto;
            outline: none;
            font-size: larger;
            border: 1px solid gray;
            border-radius: 5px;
            box-shadow: 2px 2px 2px black;
        }

        button {
            color: white;
        }

        ::placeholder {
            font-size: 10px;
            padding-left: 10px;
            color: black;
            letter-spacing: 1px;
        }

        /* ukrycie strzałek dół/góra w polu telefonu */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            appearance: none;
        }

        input[type="number"] {
            font-size: 10px;
            padding-left: 10px;
            color: black;
            letter-spacing: 1px;
            padding: 6px;
        }

        input[type="number"]:focus {
            font-size: 20px;
            padding: 0;
            padding-left: 10px;
        }

        /* powiększanie pól podczas aktywności */
        input:focus,
        textarea:focus {
            transform: scale(1.2);
            outline: none;
        }

        button:hover {
            background: #FFFFFF;
            background: linear-gradient(150deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 1) 7%, rgba(255, 0, 0, 1) 86%, rgba(255, 255, 255, 1) 93%, rgba(255, 255, 255, 1) 100%);
            padding: 10px 0;
            transform: scale(1.2);
            color: black;
        }

        textarea {
            display: block;
            resize: none;
            padding-top: 5px;
        }

        iframe {
            width: 60%;
            height: 100%;
            border-style: none;
        }
    </style>
</head>

<body>
    <h1>Din Express</h1>
    <div class="logo clearfix">
        <p>del av </p>
        <img src="https://elvebyentaxi.no/my_content/uploads/2018/08/cropped-elvebyen_taxi_03223_enlinje_4fsmall.png">
    </div>
    <div class="main clearfix">
        <form action="https://formspree.io/f/mnpdzlry" method="post">
            <input type="text" id="from" name="z" placeholder="reise fra...." required>
            <input type="text" id="to" name="do" placeholder="reise til...." required>
            <input type="number" value="0047" name="mobile" id="mobile">
            <input type="date" id="time" name="when" placeholder="tid" required>
            <textarea placeholder="info til sjåfør" name="extra info" id="extras"></textarea>
            <button type="submit">Bestil!</button>
        </form>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d20043.466256984808!2d17.036972199999997!3d51.100465549999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spl!2spl!4v1794689638039!5m2!1spl!2spl"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</body>

</html>
